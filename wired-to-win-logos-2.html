<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wired to Win &mdash; Logo Mockups Vol. 2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=Oswald:wght@700&family=Bebas+Neue&family=Space+Grotesk:wght@700;800&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0d0d0d;font-family:'Inter',sans-serif;padding:48px 24px;}
  h1{color:#fff;text-align:center;font-size:1.4rem;font-weight:700;margin-bottom:8px;letter-spacing:1px;text-transform:uppercase;}
  p.sub{color:#6b7280;text-align:center;font-size:0.85rem;margin-bottom:48px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:32px;max-width:1200px;margin:0 auto;}
  .card{background:#111827;border:1px solid #1f2937;border-radius:16px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:16px;}
  .card-label{color:#6b7280;font-size:0.72rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;align-self:flex-start;}
  .logo-wrap{width:256px;height:256px;display:flex;justify-content:center;align-items:center;flex-shrink:0;}
</style>
  <meta property="og:image" content="https://winwithfred.com/og-image.png">
  <meta name="twitter:image" content="https://winwithfred.com/og-image.png">
</head>
<body>
<h1>Wired to Win &mdash; Logo Mockups</h1>
<p class="sub">Vol. 2 &#183; 10 more concepts &#183; 256 &#215; 256</p>

<div class="grid">

  <!-- 11: Split W -->
  <div class="card">
    <span class="card-label">11 &#183; Split W</span>
    <div class="logo-wrap">
      <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" fill="#111827"/>
        <!-- Giant W -->
        <text x="20" y="200" font-family="'Bebas Neue',sans-serif" font-size="196" fill="#f97316" letter-spacing="-5">W</text>
        <!-- Dark overlay right half for contrast -->
        <rect x="128" y="0" width="128" height="256" fill="#111827"/>
        <!-- Vertical divider -->
        <rect x="126" y="40" width="3" height="176" rx="1.5" fill="#374151"/>
        <!-- Stacked text right -->
        <text x="144" y="112" font-family="'Space Grotesk',sans-serif" font-size="16" font-weight="700" fill="#9ca3af" letter-spacing="4">IRED TO</text>
        <text x="141" y="168" font-family="'Space Grotesk',sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="2">WIN</text>
      </svg>
    </div>
  </div>

  <!-- 12: Neon Outline -->
  <div class="card">
    <span class="card-label">12 &#183; Neon Outline</span>
    <div class="logo-wrap">
      <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" fill="#1f2937"/>
        <defs>
          <filter id="neon2">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <text x="128" y="126" font-family="'Bebas Neue',sans-serif" font-size="52" fill="none" stroke="#f97316" stroke-width="2" text-anchor="middle" letter-spacing="3" filter="url(#neon2)">WIRED TO</text>
        <text x="128" y="186" font-family="'Bebas Neue',sans-serif" font-size="72" fill="none" stroke="#f97316" stroke-width="2" text-anchor="middle" letter-spacing="4" filter="url(#neon2)">WIN</text>
        <text x="128" y="218" font-family="'Inter',sans-serif" font-size="9" font-weight="600" fill="#f97316" text-anchor="middle" letter-spacing="6" opacity="0.6">NEWSLETTER</text>
      </svg>
    </div>
  </div>

  <!-- 13: Chevron Mark -->
  <div class="card">
    <span class="card-label">13 &#183; Chevron</span>
    <div class="logo-wrap">
      <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" fill="#111827"/>
        <!-- Chevrons stacked -->
        <polyline points="48,118 88,60 128,118" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
        <polyline points="64,118 104,60 144,118" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
        <polyline points="80,118 120,60 160,118" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Text -->
        <text x="128" y="172" font-family="'Inter',sans-serif" font-size="18" font-weight="700" fill="#9ca3af" text-anchor="middle" letter-spacing="5">WIRED TO</text>
        <text x="128" y="218" font-family="'Bebas Neue',sans-serif" font-size="54" fill="#ffffff" text-anchor="middle" letter-spacing="6">WIN</text>
      </svg>
    </div>
  </div>

  <!-- 14: Crown -->
  <div class="card">
    <span class="card-label">14 &#183; Crown</span>
    <div class="logo-wrap">
      <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" fill="#111827"/>
        <!-- Crown -->
        <polygon points="56,72 80,116 128,52 176,116 200,72 200,148 56,148" fill="#f97316"/>
        <rect x="56" y="152" width="144" height="16" rx="4" fill="#f97316"/>
        <!-- Text -->
        <text x="128" y="196" font-family="'Bebas Neue',sans-serif" font-size="22" fill="#9ca3af" text-anchor="middle" letter-spacing="5">WIRED TO</text>
        <text x="128" y="232" font-family="'Bebas Neue',sans-serif" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="8">WIN</text>
      </svg>
    </div>
  </div>

  <!-- 15: Editorial -->
  <div class="card">
    <span class="card-label">15 &#183; Editorial</span>
    <div class="logo-wrap">
      <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" fill="#f9fafb"/>
        <!-- Top rule -->
        <rect x="24" y="56" width="208" height="4" fill="#111827"/>
        <!-- Issue label -->
        <text x="128" y="82" font-family="'Inter',sans-serif" font-size="10" font-weight="700" fill="#9ca3af" text-anchor="middle" letter-spacing="4">THE NEWSLETTER</text>
        <!-- Main headline -->
        <text x="128" y="144" font-family="Georgia,serif" font-size="50" font-weight="700" fill="#111827" text-anchor="middle">Wired</text>
        <text x="128" y="190" font-family="Georgia,serif" font-size="50" font-weight="700" fill="#f97316" text-anchor="middle">to Win</text>
        <!-- Bottom rule -->
        <rect x="24" y="202" width="208" height="3" fill="#111827"/>
        <!-- Tagline -->
        <text x="128" y="222" font-family="'Inter',sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle" letter-spacing="1">No fluff. No gimmicks. Just what works.</text>
      </svg>
    </div>
  </div>

  <!-- 16: Target -->
  <div class="card">
    <span class="card-label">16 &#183; Target</span>
    <div class="logo-wrap">
      <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" fill="#111827"/>
        <!-- Concentric circles -->
        <circle cx="128" cy="100" r="72" fill="none" stroke="#374151" stroke-width="2.5"/>
        <circle cx="128" cy="100" r="52" fill="none" stroke="#f97316" stroke-width="2.5" opacity="0.5"/>
        <circle cx="128" cy="100" r="32" fill="none" stroke="#f97316" stroke-width="2.5" opacity="0.8"/>
        <circle cx="128" cy="100" r="12" fill="#f97316"/>
        <!-- Crosshairs -->
        <line x1="128" y1="24" x2="128" y2="68" stroke="#374151" stroke-width="2"/>
        <line x1="128" y1="132" x2="128" y2="176" stroke="#374151" stroke-width="2"/>
        <line x1="52" y1="100" x2="96" y2="100" stroke="#374151" stroke-width="2"/>
        <line x1="160" y1="100" x2="204" y2="100" stroke="#374151" stroke-width="2"/>
        <!-- Text -->
        <text x="128" y="200" font-family="'Inter',sans-serif" font-size="17" font-weight="700" fill="#9ca3af" text-anchor="middle" letter-spacing="4">WIRED TO</text>
        <text x="128" y="234" font-family="'Bebas Neue',sans-serif" font-size="40" fill="#ffffff" text-anchor="middle" letter-spacing="6">WIN</text>
      </svg>
    </div>
  </div>

  <!-- 17: Gradient Fill -->
  <div class="card">
    <span class="card-label">17 &#183; Gradient Fill</span>
    <div class="logo-wrap">
      <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" fill="#1f2937"/>
        <defs>
          <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#f97316"/>
            <stop offset="100%" style="stop-color:#ffffff"/>
          </linearGradient>
        </defs>
        <!-- Large W -->
        <text x="128" y="160" font-family="'Bebas Neue',sans-serif" font-size="140" fill="url(#g1)" text-anchor="middle" letter-spacing="-4">W</text>
        <!-- TO WIN below -->
        <text x="128" y="200" font-family="'Inter',sans-serif" font-size="14" font-weight="700" fill="#9ca3af" text-anchor="middle" letter-spacing="6">IRED TO WIN</text>
        <rect x="48" y="208" width="160" height="2" rx="1" fill="#f97316" opacity="0.4"/>
      </svg>
    </div>
  </div>

  <!-- 18: Orange Invert -->
  <div class="card">
    <span class="card-label">18 &#183; Orange Block</span>
    <div class="logo-wrap">
      <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" fill="#f97316"/>
        <!-- Big W knockout -->
        <text x="128" y="148" font-family="'Bebas Neue',sans-serif" font-size="130" fill="#ffffff" text-anchor="middle" letter-spacing="-4" opacity="0.2">W</text>
        <!-- Text -->
        <text x="128" y="120" font-family="'Bebas Neue',sans-serif" font-size="30" fill="#fff" text-anchor="middle" letter-spacing="5">WIRED TO</text>
        <text x="128" y="172" font-family="'Bebas Neue',sans-serif" font-size="62" fill="#ffffff" text-anchor="middle" letter-spacing="4">WIN</text>
        <text x="128" y="204" font-family="'Inter',sans-serif" font-size="9" font-weight="700" fill="rgba(255,255,255,0.65)" text-anchor="middle" letter-spacing="5">NEWSLETTER</text>
      </svg>
    </div>
  </div>

  <!-- 19: Box Stack -->
  <div class="card">
    <span class="card-label">19 &#183; Box Stack</span>
    <div class="logo-wrap">
      <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" fill="#f9fafb"/>
        <!-- WIRED box -->
        <rect x="24" y="52" width="208" height="60" rx="8" fill="#111827"/>
        <text x="128" y="93" font-family="'Bebas Neue',sans-serif" font-size="40" fill="#ffffff" text-anchor="middle" letter-spacing="6">WIRED</text>
        <!-- TO pill -->
        <rect x="88" y="124" width="80" height="32" rx="16" fill="#e5e7eb"/>
        <text x="128" y="146" font-family="'Bebas Neue',sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" letter-spacing="4">TO</text>
        <!-- WIN orange box -->
        <rect x="24" y="168" width="208" height="64" rx="8" fill="#f97316"/>
        <text x="128" y="214" font-family="'Bebas Neue',sans-serif" font-size="54" fill="#ffffff" text-anchor="middle" letter-spacing="8">WIN</text>
      </svg>
    </div>
  </div>

  <!-- 20: Thin Line Elegant -->
  <div class="card">
    <span class="card-label">20 &#183; Thin Line Elegant</span>
    <div class="logo-wrap">
      <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" fill="#111827"/>
        <!-- Top decorative lines -->
        <rect x="24" y="72" width="84" height="1.5" fill="#374151"/>
        <rect x="148" y="72" width="84" height="1.5" fill="#374151"/>
        <circle cx="128" cy="72" r="4" fill="#f97316"/>
        <!-- Main text -->
        <text x="128" y="140" font-family="'Space Grotesk',sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">WIRED TO</text>
        <text x="128" y="192" font-family="'Space Grotesk',sans-serif" font-size="52" font-weight="800" fill="#f97316" text-anchor="middle" letter-spacing="2">WIN</text>
        <!-- Bottom lines -->
        <rect x="24" y="204" width="84" height="1.5" fill="#374151"/>
        <rect x="148" y="204" width="84" height="1.5" fill="#374151"/>
        <circle cx="128" cy="204" r="4" fill="#f97316"/>
        <!-- Tagline -->
        <text x="128" y="232" font-family="'Inter',sans-serif" font-size="8" font-weight="600" fill="#6b7280" text-anchor="middle" letter-spacing="4">WINWITHFRED.COM</text>
      </svg>
    </div>
  </div>

</div>
<p style="text-align:center;color:#374151;font-size:0.8rem;margin-top:48px;">WinWithFred &#183; Wired to Win &#183; Logo Concepts Vol. 2</p>
</body>
</html>
