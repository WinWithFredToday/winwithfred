<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wired to Win &mdash; Logo Mockups 256x256</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=Oswald:wght@700&family=Bebas+Neue&family=Space+Grotesk:wght@700;800&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0d0d0d;font-family:'Inter',sans-serif;padding:48px 24px;}
  h1{color:#fff;text-align:center;font-size:1.4rem;font-weight:700;margin-bottom:8px;letter-spacing:1px;text-transform:uppercase;}
  p.sub{color:#6b7280;text-align:center;font-size:0.85rem;margin-bottom:48px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:32px;max-width:1200px;margin:0 auto;}
  .card{background:#111827;border:1px solid #1f2937;border-radius:16px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:16px;}
  .card-label{color:#6b7280;font-size:0.72rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;align-self:flex-start;}
  .logo-wrap{width:256px;height:256px;display:flex;justify-content:center;align-items:center;flex-shrink:0;}
</style>
  <meta property="og:image" content="https://winwithfred.com/og-image.png">
  <meta name="twitter:image" content="https://winwithfred.com/og-image.png">
</head>
<body>
<h1>Wired to Win &mdash; Logo Mockups</h1>
<p class="sub">Vol. 1 &#183; 10 concepts &#183; 256 &#215; 256</p>

<div class="grid">

  <!-- 1: Bold Wordmark + Lightning -->
  <div class="card">
    <span class="card-label">01 &#183; Bold Wordmark</span>
    <div class="logo-wrap">
      <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" fill="#111827"/>
        <!-- Lightning bolt bg glow -->
        <ellipse cx="128" cy="128" rx="90" ry="90" fill="rgba(249,115,22,0.07)"/>
        <!-- Lightning bolt -->
        <polygon points="148,40 118,128 140,128 108,216 178,112 152,112" fill="#f97316"/>
        <!-- Text bottom -->
        <text x="128" y="185" font-family="'Bebas Neue',sans-serif" font-size="38" fill="#ffffff" text-anchor="middle" letter-spacing="4">WIRED TO</text>
        <text x="128" y="222" font-family="'Bebas Neue',sans-serif" font-size="38" fill="#f97316" text-anchor="middle" letter-spacing="8">WIN</text>
      </svg>
    </div>
  </div>

  <!-- 2: Circuit W Icon -->
  <div class="card">
    <span class="card-label">02 &#183; Circuit Icon</span>
    <div class="logo-wrap">
      <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" fill="#111827"/>
        <!-- Orange block -->
        <rect x="48" y="48" width="160" height="100" rx="12" fill="#f97316"/>
        <!-- W shape inside -->
        <polyline points="72,80 90,128 108,96 126,128 144,80" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
        <!-- Circuit dots -->
        <circle cx="72" cy="80" r="5" fill="#fff"/>
        <circle cx="144" cy="80" r="5" fill="#fff"/>
        <circle cx="108" cy="96" r="5" fill="#fff"/>
        <!-- Text bottom -->
        <text x="128" y="188" font-family="'Inter',sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">WIRED TO</text>
        <text x="128" y="222" font-family="'Inter',sans-serif" font-size="28" font-weight="900" fill="#f97316" text-anchor="middle" letter-spacing="5">WIN</text>
      </svg>
    </div>
  </div>

  <!-- 3: Stacked Heavy -->
  <div class="card">
    <span class="card-label">03 &#183; Stacked Heavy</span>
    <div class="logo-wrap">
      <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" fill="#f9fafb"/>
        <text x="128" y="110" font-family="'Oswald',sans-serif" font-size="42" font-weight="700" fill="#111827" text-anchor="middle" letter-spacing="3">WIRED TO</text>
        <rect x="28" y="122" width="200" height="5" rx="2.5" fill="#f97316"/>
        <text x="128" y="188" font-family="'Oswald',sans-serif" font-size="60" font-weight="700" fill="#f97316" text-anchor="middle" letter-spacing="6">WIN</text>
        <text x="128" y="220" font-family="'Inter',sans-serif" font-size="10" font-weight="600" fill="#9ca3af" text-anchor="middle" letter-spacing="4">WINWITHFRED.COM</text>
      </svg>
    </div>
  </div>

  <!-- 4: Badge / Stamp -->
  <div class="card">
    <span class="card-label">04 &#183; Badge Stamp</span>
    <div class="logo-wrap">
      <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" fill="#111827"/>
        <circle cx="128" cy="128" r="112" fill="none" stroke="#f97316" stroke-width="4"/>
        <circle cx="128" cy="128" r="98" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="6,5"/>
        <circle cx="128" cy="128" r="86" fill="#1f2937"/>
        <text x="128" y="108" font-family="'Bebas Neue',sans-serif" font-size="18" fill="#9ca3af" text-anchor="middle" letter-spacing="6">THE</text>
        <text x="128" y="148" font-family="'Bebas Neue',sans-serif" font-size="40" fill="#ffffff" text-anchor="middle" letter-spacing="2">WIRED</text>
        <text x="128" y="175" font-family="'Bebas Neue',sans-serif" font-size="18" fill="#f97316" text-anchor="middle" letter-spacing="3">TO WIN</text>
        <text x="128" y="204" font-family="'Inter',sans-serif" font-size="8" font-weight="700" fill="#6b7280" text-anchor="middle" letter-spacing="5">&#183; &#183; NEWSLETTER &#183; &#183;</text>
      </svg>
    </div>
  </div>

  <!-- 5: Signal Pulse -->
  <div class="card">
    <span class="card-label">05 &#183; Signal Pulse</span>
    <div class="logo-wrap">
      <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" fill="#111827"/>
        <!-- Pulse line -->
        <polyline points="16,108 48,108 68,60 92,156 112,80 132,120 152,120 240,120" fill="none" stroke="#f97316" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="92" cy="156" r="5" fill="#f97316"/>
        <!-- Text -->
        <text x="128" y="178" font-family="'Inter',sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">WIRED TO</text>
        <text x="128" y="218" font-family="'Inter',sans-serif" font-size="34" font-weight="900" fill="#f97316" text-anchor="middle" letter-spacing="4">WIN</text>
      </svg>
    </div>
  </div>

  <!-- 6: Monogram Circle -->
  <div class="card">
    <span class="card-label">06 &#183; Monogram</span>
    <div class="logo-wrap">
      <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" fill="#111827"/>
        <circle cx="128" cy="100" r="76" fill="#f97316"/>
        <text x="128" y="122" font-family="'Bebas Neue',sans-serif" font-size="72" fill="#ffffff" text-anchor="middle" letter-spacing="-3">WW</text>
        <text x="128" y="192" font-family="'Bebas Neue',sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="4">WIRED TO</text>
        <text x="128" y="226" font-family="'Bebas Neue',sans-serif" font-size="30" fill="#f97316" text-anchor="middle" letter-spacing="6">WIN</text>
      </svg>
    </div>
  </div>

  <!-- 7: Minimal Underline -->
  <div class="card">
    <span class="card-label">07 &#183; Minimal Underline</span>
    <div class="logo-wrap">
      <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" fill="#f9fafb"/>
        <text x="128" y="120" font-family="'Inter',sans-serif" font-size="28" font-weight="900" fill="#111827" text-anchor="middle" letter-spacing="2">WIRED TO</text>
        <text x="128" y="170" font-family="'Inter',sans-serif" font-size="48" font-weight="900" fill="#f97316" text-anchor="middle" letter-spacing="3">WIN</text>
        <rect x="68" y="180" width="120" height="5" rx="2.5" fill="#f97316"/>
        <text x="128" y="216" font-family="'Inter',sans-serif" font-size="9" font-weight="600" fill="#9ca3af" text-anchor="middle" letter-spacing="4">BY WINWITHFRED</text>
      </svg>
    </div>
  </div>

  <!-- 8: Diagonal Slash -->
  <div class="card">
    <span class="card-label">08 &#183; Slash Mark</span>
    <div class="logo-wrap">
      <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" fill="#111827"/>
        <!-- Orange slash -->
        <rect x="118" y="20" width="10" height="216" rx="5" fill="#f97316" transform="rotate(-14 123 128)"/>
        <!-- WIRED left -->
        <text x="52" y="148" font-family="'Bebas Neue',sans-serif" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="1">WIRED</text>
        <!-- WIN right -->
        <text x="196" y="148" font-family="'Bebas Neue',sans-serif" font-size="52" fill="#f97316" text-anchor="middle" letter-spacing="1">WIN</text>
        <!-- TO small center -->
        <text x="128" y="188" font-family="'Inter',sans-serif" font-size="11" font-weight="700" fill="#6b7280" text-anchor="middle" letter-spacing="3">TO</text>
      </svg>
    </div>
  </div>

  <!-- 9: Dark Box Invert -->
  <div class="card">
    <span class="card-label">09 &#183; Box Invert</span>
    <div class="logo-wrap">
      <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" fill="#f9fafb"/>
        <!-- Dark box top -->
        <rect x="16" y="60" width="224" height="72" rx="8" fill="#111827"/>
        <text x="128" y="108" font-family="'Bebas Neue',sans-serif" font-size="46" fill="#ffffff" text-anchor="middle" letter-spacing="3">WIRED TO</text>
        <!-- Orange box bottom -->
        <rect x="16" y="144" width="224" height="72" rx="8" fill="#f97316"/>
        <text x="128" y="193" font-family="'Bebas Neue',sans-serif" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="8">WIN</text>
      </svg>
    </div>
  </div>

  <!-- 10: Modern Glow -->
  <div class="card">
    <span class="card-label">10 &#183; Modern Glow</span>
    <div class="logo-wrap">
      <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" fill="#1f2937"/>
        <defs>
          <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <!-- Bolt -->
        <polygon points="148,44 112,132 138,132 100,212 184,108 152,108" fill="#f97316" filter="url(#glow)"/>
        <!-- Vertical divider -->
        <rect x="56" y="140" width="144" height="2" rx="1" fill="#374151"/>
        <!-- Text -->
        <text x="128" y="180" font-family="'Inter',sans-serif" font-size="14" font-weight="700" fill="#9ca3af" text-anchor="middle" letter-spacing="5">WIRED TO</text>
        <text x="128" y="222" font-family="'Inter',sans-serif" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4" filter="url(#glow)">WIN</text>
      </svg>
    </div>
  </div>

</div>
<p style="text-align:center;color:#374151;font-size:0.8rem;margin-top:48px;">WinWithFred &#183; Wired to Win &#183; Logo Concepts Vol. 1</p>
</body>
</html>
