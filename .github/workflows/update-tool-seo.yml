name: Update Tool Page SEO

on:
  workflow_dispatch:

jobs:
  update-seo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run SEO update script
        run: python3 update_tool_seo.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "SEO: update all tool page titles and metas to target 'free [tool] online' queries"
          git push
