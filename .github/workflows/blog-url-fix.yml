name: Fix Blog og:url and Schema URLs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run fixes
        run: |
          _b=''
          echo "${_b}" | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
      - name: Commit
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          git diff --cached --quiet && echo "No changes" || (git commit -m "GEO: Fix og:url, schema URLs, old-template nav/copyright on all blog posts" && git push)
