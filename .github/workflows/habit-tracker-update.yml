name: Update Habit Tracker Lead Magnet

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/habit-tracker-update.yml'

permissions:
  contents: write

jobs:
  update-lead-magnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update all blog posts with habit tracker messaging
        run: |
          python3 - << 'PYEOF'
          import os, re

          BREVO_URL = "https://b0a4908b.sibforms.com/v2/serve/MUIFAIyZfejVz8HaBjH-rgzTct8G025A-3rLx9JPNaGGjuwzFgf3keyzyLwEFgJjKe7A2yMJKQGUo8WM93shIKqvqI8jGEc8YRaePejm0I-8fMOtSmHI77tgaAavCIUbT11MQlxawGWXKvkxClIhzFbQKz7rNHKkJARUdQqwA2u6Xp16kUJsswaBwEqU1N2MPfb6kP5r9LuNd0Dqrw=="

          NEW_CAPTURE = (
            '    <h2>Get Your Free 30-Day Habit Tracker</h2>\n'
            '              <p>A free printable PDF to track 30 days of habits, build streaks, and make change actually stick. Enter your email and I\'ll send it right over.</p>\n'
            '              <form action="' + BREVO_URL + '" method="POST" data-type="subscription" class="capture-form">\n'
            '                <input type="email" name="EMAIL" placeholder="Your email address" required autocomplete="email">\n'
            '                <input type="text" name="email_address_check" value="" style="display:none" aria-hidden="true" tabindex="-1">\n'
            '                <input type="hidden" name="locale" value="en">\n'
            '                <button type="submit">Send Me the Free Tracker &#8594;</button>\n'
            '              </form>\n'
            '              <p class="capture-fine">No spam. Unsubscribe anytime with one click.</p>'
          )

          STICKY_BAR = (
            '<!-- WF Sticky Bar -->\n'
            '<div id="wf-sticky-bar" style="position:fixed;bottom:0;left:0;right:0;z-index:9998;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);padding:14px 20px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;box-shadow:0 -4px 24px rgba(0,0,0,0.35);transform:translateY(100%);transition:transform 0.45s ease;">\n'
            '  <span style="color:#fff;font-weight:700;font-size:14px;white-space:nowrap;">&#127919; Free 30-Day Habit Tracker PDF</span>\n'
            '  <form action="' + BREVO_URL + '" method="POST" data-type="subscription" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">\n'
            '    <input type="email" name="EMAIL" placeholder="Your email" required autocomplete="email" style="padding:9px 14px;border-radius:6px;border:none;font-size:13px;outline:none;min-width:180px;font-family:inherit;">\n'
            '    <input type="text" name="email_address_check" value="" style="display:none" aria-hidden="true" tabindex="-1">\n'
            '    <input type="hidden" name="locale" value="en">\n'
            '    <button type="submit" style="padding:9px 18px;background:#f97316;color:#fff;border:none;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit;">Send It Free &#8594;</button>\n'
            '  </form>\n'
            '  <button id="wf-bar-close" style="background:none;border:none;color:rgba(255,255,255,0.5);font-size:22px;cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0;">&#215;</button>\n'
            '</div>\n'
            '<script>\n'
            '(function(){\n'
            '  if(sessionStorage.getItem(\'wf-bar-closed\')) return;\n'
            '  var bar = document.getElementById(\'wf-sticky-bar\');\n'
            '  setTimeout(function(){ bar.style.transform=\'translateY(0)\'; }, 5000);\n'
            '  document.getElementById(\'wf-bar-close\').addEventListener(\'click\', function(){\n'
            '    bar.style.transform=\'translateY(100%)\';\n'
            '    sessionStorage.setItem(\'wf-bar-closed\',\'1\');\n'
            '  });\n'
            '})();\n'
            '<\/script>'
          )

          POPUP = (
            '<!-- WF Exit Intent Popup -->\n'
            '<div id="wf-popup" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:10000;align-items:center;justify-content:center;padding:20px;">\n'
            '  <div style="background:#fff;border-radius:18px;max-width:460px;width:100%;padding:44px 36px 36px;text-align:center;position:relative;animation:wfIn 0.3s ease;">\n'
            '    <button id="wf-popup-close" style="position:absolute;top:14px;right:18px;background:none;border:none;font-size:26px;cursor:pointer;color:#9ca3af;line-height:1;">&#215;</button>\n'
            '    <div style="font-size:52px;margin-bottom:14px;">&#127919;</div>\n'
            '    <h2 style="font-size:22px;font-weight:900;color:#111827;margin:0 0 10px;line-height:1.3;">Hold on &#8212; grab your free tracker</h2>\n'
            '    <p style="color:#6b7280;margin:0 0 24px;font-size:14px;line-height:1.7;">A free 30-day printable habit tracker PDF. Track your habits, build your streak, and make progress you can actually see.</p>\n'
            '    <form action="' + BREVO_URL + '" method="POST" data-type="subscription" style="display:flex;flex-direction:column;gap:10px;">\n'
            '      <input type="email" name="EMAIL" placeholder="Your email address" required autocomplete="email" style="padding:13px 16px;border-radius:8px;border:2px solid #e5e7eb;font-size:14px;outline:none;width:100%;font-family:inherit;box-sizing:border-box;">\n'
            '      <input type="text" name="email_address_check" value="" style="display:none" aria-hidden="true" tabindex="-1">\n'
            '      <input type="hidden" name="locale" value="en">\n'
            '      <button type="submit" style="padding:14px;background:#f97316;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;">Send Me the Free Tracker &#8594;</button>\n'
            '    </form>\n'
            '    <p style="color:#9ca3af;font-size:11px;margin:12px 0 0;">No spam. Unsubscribe anytime.</p>\n'
            '  </div>\n'
            '</div>\n'
            '<style>@keyframes wfIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}<\/style>\n'
            '<script>\n'
            '(function(){\n'
            '  if(sessionStorage.getItem(\'wf-popup-closed\')) return;\n'
            '  var popup = document.getElementById(\'wf-popup\');\n'
            '  var triggered = false;\n'
            '  function show(){\n'
            '    if(triggered) return;\n'
            '    triggered = true;\n'
            '    popup.style.display = \'flex\';\n'
            '  }\n'
            '  document.addEventListener(\'mouseleave\', function(e){ if(e.clientY < 40) show(); });\n'
            '  setTimeout(function(){ show(); }, 90000);\n'
            '  document.getElementById(\'wf-popup-close\').addEventListener(\'click\', function(){\n'
            '    popup.style.display = \'none\';\n'
            '    sessionStorage.setItem(\'wf-popup-closed\',\'1\');\n'
            '  });\n'
            '  popup.addEventListener(\'click\', function(e){ if(e.target===popup){ popup.style.display=\'none\'; sessionStorage.setItem(\'wf-popup-closed\',\'1\'); } });\n'
            '})();\n'
            '<\/script>'
          )

          updated = 0
          already_done = 0

          for fname in sorted(os.listdir('.')):
            if not (fname.startswith('blog-') and fname.endswith('.html')):
              continue
            try:
              with open(fname, 'r', encoding='utf-8') as f:
                content = f.read()
              if 'wf-sticky-bar' in content:
                already_done += 1
                continue
              orig = content
              content = re.sub(
                r'<h2>Enjoyed This\? Get More Free\.</h2>.*?<p class="capture-fine">.*?</p>',
                NEW_CAPTURE, content, flags=re.DOTALL
              )
              if '</body>' in content:
                content = content.replace('</body>', STICKY_BAR + '\n' + POPUP + '\n</body>')
              if content != orig:
                with open(fname, 'w', encoding='utf-8') as f:
                  f.write(content)
                updated += 1
                print('Updated: ' + fname)
              else:
                print('No match: ' + fname)
            except Exception as e:
              print('Error ' + fname + ': ' + str(e))

          print('DONE: ' + str(updated) + ' updated, ' + str(already_done) + ' already done')
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "Nothing to commit" || (git commit -m "Add habit tracker lead magnet: update forms, sticky bar, popup" && git push)
