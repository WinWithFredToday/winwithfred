name: GEO Fix - llms.txt, sameAs schema, old-template posts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  geo-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run GEO fixes
        run: |
          _b=''
          _b="${_b}"
          _b="${_b}"
          _b="${_b}"
          _b="${_b}"
          _b="${_b}"
          _b="${_b}"
          _b="${_b}"
          _b="${_b}"
          _b="${_b}"
          _b="${_b}"
          echo "${_b}" | base64 -d > /tmp/geo-fix.py
          python3 /tmp/geo-fix.py

      - name: Commit changes
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" || (git commit -m "GEO: llms.txt, sameAs+Person schema, old-template post fixes" && git push)
