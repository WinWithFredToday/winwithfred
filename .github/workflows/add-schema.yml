name: Add JSON-LD Schema
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Inject schema
        run: |
          _b=''
          echo "${_b}" | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
      - name: Commit
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          git diff --cached --quiet && echo "No changes" || (git commit -m "GEO: Add JSON-LD schema to homepage" && git push)
