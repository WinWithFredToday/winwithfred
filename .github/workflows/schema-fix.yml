name: Add Schema JSON-LD to Homepage
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  schema-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Inject Organization+Person JSON-LD schema
        run: |
          _b=''
          echo "${_b}" | base64 -d > /tmp/schema-inject.py
          python3 /tmp/schema-inject.py

      - name: Commit changes
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" || (git commit -m "GEO: Add Organization+Person JSON-LD schema to homepage" && git push)
