name: GEO – Add Visual FAQ + Author Bio + Fix Schema URLs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run GEO patch
        run: python3 .github/scripts/geo-faq-patch.py

      - name: Commit and push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "GEO: Add visual FAQ blocks + author bio box + fix schema URLs"
            git push
          fi
