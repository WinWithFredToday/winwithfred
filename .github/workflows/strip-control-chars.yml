name: Strip C1 Control Characters
on:
  workflow_dispatch:

jobs:
  strip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Remove C1 control characters from all HTML files
        run: |
          python3 << 'PYEOF'
          import os, re

          # C1 control characters: U+0080–U+009F (never valid visible content in HTML)
          c1_pattern = re.compile(r'[\x80-\x9f]')
          total = 0

          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ['.git', '.github', 'node_modules']]
              for f in files:
                  if not f.endswith('.html'):
                      continue
                  path = os.path.join(root, f)
                  with open(path, 'r', encoding='utf-8', errors='replace') as fh:
                      content = fh.read()
                  cleaned = c1_pattern.sub('', content)
                  if cleaned != content:
                      with open(path, 'w', encoding='utf-8') as fh:
                          fh.write(cleaned)
                      removed = len(content) - len(cleaned)
                      print(f"{path}: removed {removed} control chars")
                      total += 1

          print(f"Done. Fixed {total} files.")
          PYEOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Strip C1 control characters from all HTML files"
          git push
