name: Fix Homepage SEO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Patch index.html
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py

      - name: Commit changes
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add index.html
          git diff --cached --quiet && echo "No changes to commit" || (git commit -m "SEO: Add JSON-LD schema + author identity to homepage" && git push)
